<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Parasitoid–Host Dynamics — Simulation</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
<div class="card" id="simbox">
      <div class="simbar"><span class="simbar-logo" aria-hidden="true"><img src="images\logo.svg" alt="Amrita Vishwa Vidyapeetham"></span><h1 class="simbar-title">Parasitoid–Host Dynamics</h1><button class="fs-btn" id="fsBtn" onclick="toggleFS()" title="Toggle full screen" aria-label="Toggle full screen">⛶</button></div>
      <div class="subtabs" id="subtabs">
        <button class="subtab active" data-model="0">Nicholson–Bailey</button>
        <button class="subtab" data-model="1">Host density dependence</button>
        <button class="subtab" data-model="2">Negative binomial</button>
        <button class="subtab" data-model="3">Poisson vs Neg-binomial</button>
      </div>
      <div class="sim">
        <div class="controls">
          <!-- model 0 -->
          <div class="cset active" data-c="0">
            <div class="field"><label>Initial host Ht <span class="val" id="v_ht0">25</span></label><input type="range" id="ht0" min="1" max="1000" value="25" oninput="sync()"></div>
            <div class="field"><label>Initial parasitoid Pt <span class="val" id="v_pt0">10</span></label><input type="range" id="pt0" min="1" max="1000" value="10" oninput="sync()"></div>
            <div class="field"><label>Host growth R <span class="val" id="v_r0">1.5</span></label><input type="range" id="r0" min="0.5" max="3" step="0.05" value="1.5" oninput="sync()"></div>
            <div class="field"><label>Attack rate a <span class="val" id="v_a0">0.023</span></label><input type="range" id="a0" min="0.001" max="0.1" step="0.001" value="0.023" oninput="sync()"></div>
            <div class="field"><label>Conversion c <span class="val" id="v_c0">2</span></label><input type="range" id="c0" min="1" max="3" step="0.1" value="2" oninput="sync()"></div>
          </div>
          <!-- model 1 -->
          <div class="cset" data-c="1">
            <div class="field"><label>Initial host Ht <span class="val" id="v_ht1">2000</span></label><input type="range" id="ht1" min="1" max="2000" value="2000" oninput="sync()"></div>
            <div class="field"><label>Parasitoid intro time T <span class="val" id="v_t1">20</span></label><input type="range" id="t1" min="0" max="100" value="20" oninput="sync()"></div>
            <div class="field"><label>Introduced parasitoids Pt <span class="val" id="v_pt1">800</span></label><input type="range" id="pt1" min="1" max="2000" value="800" oninput="sync()"></div>
            <div class="field"><label>Host growth R <span class="val" id="v_r1">3</span></label><input type="range" id="r1" min="0.5" max="4" step="0.05" value="3" oninput="sync()"></div>
            <div class="field"><label>Attack rate a <span class="val" id="v_a1">0.01</span></label><input type="range" id="a1" min="0.001" max="0.1" step="0.001" value="0.01" oninput="sync()"></div>
            <div class="field"><label>Conversion c <span class="val" id="v_c1">1</span></label><input type="range" id="c1" min="1" max="10" step="0.5" value="1" oninput="sync()"></div>
            <div class="field"><label>Host capacity K <span class="val" id="v_k1">8000</span></label><input type="range" id="k1" min="2000" max="8000" step="100" value="8000" oninput="sync()"></div>
          </div>
          <!-- model 2 -->
          <div class="cset" data-c="2">
            <div class="field"><label>Initial host Ht <span class="val" id="v_ht2">25</span></label><input type="range" id="ht2" min="1" max="1000" value="25" oninput="sync()"></div>
            <div class="field"><label>Initial parasitoid Pt <span class="val" id="v_pt2">10</span></label><input type="range" id="pt2" min="1" max="1000" value="10" oninput="sync()"></div>
            <div class="field"><label>Host growth R <span class="val" id="v_r2">1.5</span></label><input type="range" id="r2" min="0.1" max="10" step="0.1" value="1.5" oninput="sync()"></div>
            <div class="field"><label>Attack rate a <span class="val" id="v_a2">0.023</span></label><input type="range" id="a2" min="0.001" max="0.1" step="0.001" value="0.023" oninput="sync()"></div>
            <div class="field"><label>Conversion c <span class="val" id="v_c2">2</span></label><input type="range" id="c2" min="1" max="10" step="0.5" value="2" oninput="sync()"></div>
            <div class="field"><label>Clumping k <span class="val" id="v_k2">1.3</span></label><input type="range" id="k2" min="0.1" max="1.5" step="0.05" value="1.3" oninput="sync()"><div class="hint">Smaller k = more aggregation = more stable.</div></div>
          </div>
          <!-- model 3 -->
          <div class="cset" data-c="3">
            <div class="field"><label>Start parasitoids <span class="val" id="v_pt3">10</span></label><input type="range" id="pt3" min="1" max="5000" value="10" oninput="sync()"></div>
            <div class="field"><label>Attack rate a <span class="val" id="v_a3">0.001</span></label><input type="range" id="a3" min="0.001" max="0.1" step="0.001" value="0.001" oninput="sync()"></div>
            <div class="field"><label>Clumping k <span class="val" id="v_k3">0.5</span></label><input type="range" id="k3" min="0.1" max="10" step="0.1" value="0.5" oninput="sync()"></div>
          </div>
          <div class="btnrow">
            <button class="btn btn-primary" onclick="plot()">▶ Plot</button>
            <button class="btn btn-ghost" onclick="resetSim()">↺ Reset</button>
          </div>
          <div class="dl-label">Download</div>
<div class="btnrow">
            <button class="btn btn-accent" onclick="downloadPNG()">⤓ PNG</button>
            <button class="btn btn-accent" onclick="downloadCSV()">⤓ CSV</button>
          </div>
        </div>

        <div class="plotwrap">
          <div class="plot-title" id="plotTitle">Nicholson–Bailey model</div>
          <canvas class="chart" id="chart" width="720" height="460"></canvas>
          <div class="legend" id="legend"></div>
          <div class="readout"><span>Cursor: X = <b id="rx">–</b>, Y = <b id="ry">–</b></span></div>
        </div>
      </div>
    </div>
<div class="toast" id="toast"></div>
<script src="./js/main.js"></script>
<script src="../assets/js/iframeResize.js"></script>
        
        </body>
</html>
